openapi: 3.0.3
info:
  title: Gokku API
  version: 0.1.0
  description: |
    REST API of Gokku, a web GUI for Dokku. This file is the contract: Go types and the
    TypeScript client are generated from it (`task gen`). Every operation must be
    registered in the Go router, and every route must be described here; a test enforces both.

    Authentication is a session cookie (`gokku_session`) or `Authorization: Bearer gk_...`.
    Unsafe methods with a cookie must be same-origin (AUTH-5).
servers:
  - url: /api/v1

tags:
  - name: setup
  - name: auth
  - name: me
  - name: users
  - name: tokens
  - name: server
  - name: projects
  - name: apps
  - name: services
  - name: jobs
  - name: audit

paths:
  /setup/status:
    get:
      operationId: getSetupStatus
      tags: [setup]
      security: []
      summary: Whether the first admin still has to be created (AUTH-1)
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }

  /setup:
    post:
      operationId: completeSetup
      tags: [setup]
      security: []
      summary: Create the first admin and sign in (AUTH-1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201":
          description: First admin created; the session cookie is set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Signed in; the session cookie is set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      security: []
      responses:
        "204": { description: Signed out; the session cookie is cleared }

  /auth/invites/{token}:
    get:
      operationId: getInvite
      tags: [auth]
      security: []
      summary: Look up a pending invite to show the username (AUTH-7)
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The invite is valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
        "404": { $ref: "#/components/responses/Error" }

  /auth/accept-invite:
    post:
      operationId: acceptInvite
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInviteRequest" }
      responses:
        "200":
          description: Password set and signed in; the session cookie is set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /me:
    get:
      operationId: getMe
      tags: [me]
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateMe
      tags: [me]
      summary: Change own username or theme (USR-1, USR-4)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /me/password:
    post:
      operationId: changePassword
      tags: [me]
      summary: Change own password; revokes all other sessions (USR-2)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/Error" }

  /me/sessions:
    get:
      operationId: listMySessions
      tags: [me]
      responses:
        "200":
          description: Active sessions of the signed-in user (USR-3)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }

  /me/sessions/{id}:
    delete:
      operationId: revokeMySession
      tags: [me]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Session revoked }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /users:
    get:
      operationId: listUsers
      tags: [users]
      responses:
        "200":
          description: All users (USR-5)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
    post:
      operationId: inviteUser
      tags: [users]
      summary: Create an invited user and return a one-time invite link (AUTH-7)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteUserRequest" }
      responses:
        "201":
          description: User invited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteCreated" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Change role, or disable and enable (USR-5)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteUser
      tags: [users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: "User, sessions and tokens deleted" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /users/{id}/invite:
    post:
      operationId: resetInvite
      tags: [users]
      summary: Issue a new invite link for an invited user (USR-5)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: New invite link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteCreated" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /tokens:
    get:
      operationId: listTokens
      tags: [tokens]
      responses:
        "200":
          description: API tokens that are not revoked (USR-6)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Token" }
    post:
      operationId: createToken
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTokenRequest" }
      responses:
        "201":
          description: Token created; the secret is shown only in this response (AUTH-6)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenCreated" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /tokens/{id}:
    delete:
      operationId: revokeToken
      tags: [tokens]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Token revoked }
        "404": { $ref: "#/components/responses/Error" }

  /server:
    get:
      operationId: getServer
      tags: [server]
      summary: Server name, Dokku version, plugins and reachability (SRV-1)
      responses:
        "200":
          description: Server information from the snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }

  /server/rescan:
    post:
      operationId: rescanServer
      tags: [server]
      summary: Re-run the capability probe and refresh the snapshot (PLG-2)
      responses:
        "200":
          description: Server information after the rescan, which may report Dokku as unreachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }
        "403": { $ref: "#/components/responses/Error" }

  /settings:
    get:
      operationId: getSettings
      tags: [server]
      summary: Server-wide settings (SET-1, SET-2)
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateSettings
      tags: [server]
      summary: "Change settings; fields left out keep their value. Global domains are written to Dokku (SET-1)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSettingsRequest" }
      responses:
        "200":
          description: The settings after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /plugins:
    get:
      operationId: listPlugins
      tags: [server]
      summary: Installed plugins that Gokku uses and recognised plugins that are not installed (PLG-1)
      responses:
        "200":
          description: Plugins
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginList" }

  /events:
    get:
      operationId: streamEvents
      tags: [server]
      summary: Server-sent events that tell the client which data changed (EVT-1)
      description: |
        Each message has an `event` name (app.updated, app.removed, service.updated,
        project.updated, job.updated, server.status) and JSON `data` naming the object.
        A heartbeat comment is sent every 15 seconds (EVT-3).
      responses:
        "200":
          description: An open event stream
          content:
            text/event-stream:
              schema: { type: string }

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      responses:
        "200":
          description: Every project with its apps and services
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectSummary" }
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project (PRJ-1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /projects/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      operationId: getProject
      tags: [projects]
      summary: Project overview (PRJ-3)
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetail" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Change the name or description; the slug is immutable (PRJ-1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: "Delete the project; its apps and services become unassigned (PRJ-4)"
      description: "When managed variables must be removed from member apps, the answer is 202 with the job."
      parameters:
        - { name: confirm, in: query, required: true, schema: { type: string }, description: Must equal the slug }
      responses:
        "202":
          description: Deleted; a job removes the managed variables
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /projects/{slug}/apps/{app}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: app, in: path, required: true, schema: { type: string } }
    put:
      operationId: addProjectApp
      tags: [projects]
      summary: "Add an app to the project, moving it out of any other project (PRJ-2)"
      description: "When shared variables must be written or removed (SHV-2), the answer is 202 with the job."
      responses:
        "202":
          description: The app is in the project; a job updates its shared variables
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "204": { description: The app is in the project }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeProjectApp
      tags: [projects]
      summary: Release an app from the project (PRJ-2)
      description: "When managed variables must be removed from it (SHV-2), the answer is 202 with the job."
      responses:
        "202":
          description: The app is unassigned; a job removes its managed variables
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "204": { description: The app is unassigned }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /projects/{slug}/services/{type}/{name}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: type, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
    put:
      operationId: addProjectService
      tags: [projects]
      summary: "Add a service to the project, moving it out of any other project (PRJ-2)"
      responses:
        "204": { description: The service is in the project }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeProjectService
      tags: [projects]
      summary: Release a service from the project (PRJ-2)
      responses:
        "204": { description: The service is unassigned }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /projects/{slug}/actions/restart:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      operationId: restartProjectApps
      tags: [projects]
      summary: "Restart every app of the project: one parent job, one child per app (PRJ-5, JOB-5)"
      responses:
        "202":
          description: The parent job was queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /projects/{slug}/actions/stop:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      operationId: stopProjectApps
      tags: [projects]
      summary: "Stop every app of the project: one parent job, one child per app (PRJ-5, JOB-5)"
      responses:
        "202":
          description: The parent job was queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /projects/{slug}/actions/start:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      operationId: startProjectApps
      tags: [projects]
      summary: "Start every app of the project: one parent job, one child per app (PRJ-5, JOB-5)"
      responses:
        "202":
          description: The parent job was queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /projects/{slug}/actions/rebuild:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      operationId: rebuildProjectApps
      tags: [projects]
      summary: "Rebuild every app of the project: one parent job, one child per app (PRJ-5, JOB-5)"
      responses:
        "202":
          description: The parent job was queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /apps:
    post:
      operationId: createApp
      tags: [apps]
      summary: Create an app in a project (APP-3)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAppRequest" }
      responses:
        "201":
          description: Created; the response says how to push to it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppCreated" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    get:
      operationId: listApps
      tags: [apps]
      summary: Every app with status, project, domains, last deploy and linked services (APP-1)
      responses:
        "200":
          description: Apps from the snapshot
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppSummary" }

  /apps/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      operationId: getApp
      tags: [apps]
      responses:
        "200":
          description: The app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppDetail" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateApp
      tags: [apps]
      summary: "Rename the app (APP-4) or move it to another project (APP-7), one at a time"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAppRequest" }
      responses:
        "202":
          description: A job renames the app, or updates its shared variables after a move
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "204": { description: Moved; no shared variables to update }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      operationId: destroyApp
      tags: [apps]
      summary: "Destroy the app as a job; linked services are kept (APP-5)"
      parameters:
        - { name: confirm, in: query, required: true, schema: { type: string }, description: Must equal the app name }
      responses:
        "202":
          description: The destroy job was queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: Every datastore service with status, project and linked apps (SVC-2)
      responses:
        "200":
          description: Services from the snapshot
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServiceSummary" }
    post:
      operationId: createService
      tags: [services]
      summary: "Create a service in a project, as a job (SVC-2)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateServiceRequest" }
      responses:
        "202":
          description: The create job was queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /services/{type}/{name}:
    parameters:
      - { name: type, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      operationId: getService
      tags: [services]
      summary: "One service with its links and masked connection details (SVC-4)"
      responses:
        "200":
          description: The service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceDetail" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: destroyService
      tags: [services]
      summary: "Destroy the service as a job; refused while apps are linked (SVC-2)"
      parameters:
        - { name: confirm, in: query, required: true, schema: { type: string }, description: Must equal the service name }
      responses:
        "202":
          description: The destroy job was queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /services/{type}/{name}/reveal:
    parameters:
      - { name: type, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      operationId: revealService
      tags: [services]
      summary: "The connection string with its password; audited without it (SVC-4)"
      responses:
        "200":
          description: The connection string
          content:
            application/json:
