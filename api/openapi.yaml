openapi: 3.0.3
info:
  title: Gokku API
  version: 0.1.0
  description: |
    REST API of Gokku, a web GUI for Dokku. This file is the contract: Go types and the
    TypeScript client are generated from it (`task gen`). Every operation must be
    registered in the Go router, and every route must be described here; a test enforces both.

    Authentication is a session cookie (`gokku_session`) or `Authorization: Bearer gk_...`.
    Unsafe methods with a cookie must be same-origin (AUTH-5).
servers:
  - url: /api/v1

tags:
  - name: setup
  - name: auth
  - name: me
  - name: users
  - name: tokens
  - name: server
  - name: projects
  - name: apps
  - name: services

paths:
  /setup/status:
    get:
      operationId: getSetupStatus
      tags: [setup]
      security: []
      summary: Whether the first admin still has to be created (AUTH-1)
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }

  /setup:
    post:
      operationId: completeSetup
      tags: [setup]
      security: []
      summary: Create the first admin and sign in (AUTH-1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201":
          description: First admin created; the session cookie is set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Signed in; the session cookie is set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      security: []
      responses:
        "204": { description: Signed out; the session cookie is cleared }

  /auth/invites/{token}:
    get:
      operationId: getInvite
      tags: [auth]
      security: []
      summary: Look up a pending invite to show the username (AUTH-7)
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The invite is valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
        "404": { $ref: "#/components/responses/Error" }

  /auth/accept-invite:
    post:
      operationId: acceptInvite
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInviteRequest" }
      responses:
        "200":
          description: Password set and signed in; the session cookie is set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /me:
    get:
      operationId: getMe
      tags: [me]
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateMe
      tags: [me]
      summary: Change own username or theme (USR-1, USR-4)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /me/password:
    post:
      operationId: changePassword
      tags: [me]
      summary: Change own password; revokes all other sessions (USR-2)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/Error" }

  /me/sessions:
    get:
      operationId: listMySessions
      tags: [me]
      responses:
        "200":
          description: Active sessions of the signed-in user (USR-3)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }

  /me/sessions/{id}:
    delete:
      operationId: revokeMySession
      tags: [me]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Session revoked }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /users:
    get:
      operationId: listUsers
      tags: [users]
      responses:
        "200":
          description: All users (USR-5)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
    post:
      operationId: inviteUser
      tags: [users]
      summary: Create an invited user and return a one-time invite link (AUTH-7)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteUserRequest" }
      responses:
        "201":
          description: User invited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteCreated" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Change role, or disable and enable (USR-5)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteUser
      tags: [users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: "User, sessions and tokens deleted" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /users/{id}/invite:
    post:
      operationId: resetInvite
      tags: [users]
      summary: Issue a new invite link for an invited user (USR-5)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: New invite link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteCreated" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /tokens:
    get:
      operationId: listTokens
      tags: [tokens]
      responses:
        "200":
          description: API tokens that are not revoked (USR-6)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Token" }
    post:
      operationId: createToken
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTokenRequest" }
      responses:
        "201":
          description: Token created; the secret is shown only in this response (AUTH-6)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenCreated" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /tokens/{id}:
    delete:
      operationId: revokeToken
      tags: [tokens]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Token revoked }
        "404": { $ref: "#/components/responses/Error" }

  /server:
    get:
      operationId: getServer
      tags: [server]
      summary: Server name, Dokku version, plugins and reachability (SRV-1)
      responses:
        "200":
          description: Server information from the snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }

  /server/rescan:
    post:
      operationId: rescanServer
      tags: [server]
      summary: Re-run the capability probe and refresh the snapshot (PLG-2)
      responses:
        "200":
          description: Server information after the rescan, which may report Dokku as unreachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }
        "403": { $ref: "#/components/responses/Error" }

  /plugins:
    get:
      operationId: listPlugins
      tags: [server]
      summary: Installed plugins that Gokku uses and recognised plugins that are not installed (PLG-1)
      responses:
        "200":
          description: Plugins
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginList" }

  /events:
    get:
      operationId: streamEvents
      tags: [server]
      summary: Server-sent events that tell the client which data changed (EVT-1)
      description: |
        Each message has an `event` name (app.updated, app.removed, service.updated,
        project.updated, job.updated, server.status) and JSON `data` naming the object.
        A heartbeat comment is sent every 15 seconds (EVT-3).
      responses:
        "200":
          description: An open event stream
          content:
            text/event-stream:
              schema: { type: string }

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      responses:
        "200":
          description: Every project with its apps and services
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectSummary" }
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project (PRJ-1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /projects/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      operationId: getProject
      tags: [projects]
      summary: Project overview (PRJ-3)
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetail" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Change the name or description; the slug is immutable (PRJ-1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: "Delete the project; its apps and services become unassigned (PRJ-4)"
      parameters:
        - { name: confirm, in: query, required: true, schema: { type: string }, description: Must equal the slug }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /projects/{slug}/apps/{app}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: app, in: path, required: true, schema: { type: string } }
    put:
      operationId: addProjectApp
      tags: [projects]
      summary: "Add an app to the project, moving it out of any other project (PRJ-2)"
      responses:
        "204": { description: The app is in the project }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeProjectApp
      tags: [projects]
      summary: Release an app from the project (PRJ-2)
      responses:
        "204": { description: The app is unassigned }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /projects/{slug}/services/{type}/{name}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: type, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
    put:
      operationId: addProjectService
      tags: [projects]
      summary: "Add a service to the project, moving it out of any other project (PRJ-2)"
      responses:
        "204": { description: The service is in the project }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeProjectService
      tags: [projects]
      summary: Release a service from the project (PRJ-2)
      responses:
        "204": { description: The service is unassigned }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /apps:
    get:
      operationId: listApps
      tags: [apps]
      summary: Every app with status, project, domains, last deploy and linked services (APP-1)
      responses:
        "200":
          description: Apps from the snapshot
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppSummary" }

  /apps/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      operationId: getApp
      tags: [apps]
      responses:
        "200":
          description: The app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppDetail" }
        "404": { $ref: "#/components/responses/Error" }

  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: Every datastore service with status, project and linked apps (SVC-2)
      responses:
        "200":
          description: Services from the snapshot
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServiceSummary" }

security:
  - session: []
  - bearer: []

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: gokku_session
    bearer:
      type: http
      scheme: bearer

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
              description: Per-field validation messages, keyed by request field name

    ErrorCode:
      type: string
      enum:
        - validation_failed
        - invalid_credentials
        - rate_limited
        - setup_complete
        - unauthorized
        - forbidden
        - csrf_failed
        - not_found
        - method_not_allowed
        - last_admin
        - username_taken
        - token_name_taken
        - invite_invalid
        - not_invited
        - wrong_password
        - cannot_revoke_current
        - project_exists
        - confirm_mismatch
        - dokku_unreachable
        - internal

    Role:
      type: string
      enum: [viewer, operator, admin]

    UserStatus:
      type: string
      enum: [active, invited, disabled]

    Theme:
      type: string
      enum: [system, light, dark]

    Username:
      type: string
      minLength: 3
      maxLength: 32
      pattern: "^[a-z0-9][a-z0-9_-]{2,31}$"
      description: Lowercase letters, digits, dash and underscore; starts with a letter or digit (USR-1)

    Password:
      type: string
      maxLength: 1024
      description: Minimum length is SetupStatus.min_password_length (AUTH-2)

    SetupStatus:
      type: object
      required: [setup_required, min_password_length]
      properties:
        setup_required: { type: boolean }
        min_password_length: { type: integer }

    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 64 }
        password: { $ref: "#/components/schemas/Password" }

    Me:
      type: object
      required: [id, username, role, theme]
      properties:
        id: { type: string }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        theme: { $ref: "#/components/schemas/Theme" }

    UpdateMeRequest:
      type: object
      properties:
        username: { $ref: "#/components/schemas/Username" }
        theme: { $ref: "#/components/schemas/Theme" }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { $ref: "#/components/schemas/Password" }
        new_password: { $ref: "#/components/schemas/Password" }

    Session:
      type: object
      required: [id, created_at, last_seen_at, expires_at, user_agent, ip, current]
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        user_agent: { type: string }
        ip: { type: string }
        current: { type: boolean, description: True for the session making the request }

    Invite:
      type: object
      required: [username, expires_at]
      properties:
        username: { type: string }
        expires_at: { type: string, format: date-time }

    AcceptInviteRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { $ref: "#/components/schemas/Password" }

    User:
      type: object
      required: [id, username, role, status, created_at]
      properties:
        id: { type: string }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/UserStatus" }
        created_at: { type: string, format: date-time }
        last_active_at: { type: string, format: date-time, nullable: true }
        invite_expires_at: { type: string, format: date-time, nullable: true }

    InviteUserRequest:
      type: object
      required: [username, role]
      properties:
        username: { $ref: "#/components/schemas/Username" }
        role: { $ref: "#/components/schemas/Role" }

    InviteCreated:
      type: object
      required: [user, invite_url, expires_at]
      properties:
        user: { $ref: "#/components/schemas/User" }
        invite_url: { type: string, description: "One-time link, shown only in this response" }
        expires_at: { type: string, format: date-time }

    UpdateUserRequest:
      type: object
      properties:
        role: { $ref: "#/components/schemas/Role" }
        status:
          type: string
          enum: [active, disabled]
          description: Disable or re-enable a user. Invited users become active by accepting their invite.

    Token:
      type: object
      required: [id, name, prefix, role, owner, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string, description: "First characters of the token, for recognition" }
        role: { $ref: "#/components/schemas/Role" }
        owner: { type: string, description: Username of the owner }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }

    CreateTokenRequest:
      type: object
      required: [name, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        role: { $ref: "#/components/schemas/Role" }

    TokenCreated:
      type: object
      required: [token, secret]
      properties:
        token: { $ref: "#/components/schemas/Token" }
        secret: { type: string, description: "The full token (gk_...). Shown once." }

    AppStatus:
      type: string
      enum: [running, stopped, deploying, failed]
      description: Derived as in DESIGN.md "Status derivation" (APP-2)

    ServiceStatus:
      type: string
      enum: [running, stopped, missing]
      description: missing means the service container does not exist

    ServerInfo:
      type: object
      required: [name, host, reachable, plugins, datastores, letsencrypt, unavailable]
      properties:
        name: { type: string, description: The server's host name }
        host: { type: string, description: "Host for git remotes: GOKKU_DOKKU_HOST, or the request host" }
        dokku_version: { type: string, nullable: true, description: Null until the first successful probe }
        reachable: { type: boolean }
        last_ok_at: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true, description: Why the last refresh failed }
        error_command: { type: string, nullable: true, description: The dokku command that failed }
        plugins:
          type: array
          items: { type: string }
          description: Names of the installed and enabled plugins
        datastores:
          type: array
          items: { type: string }
          description: Datastore plugins Gokku can use (SVC-1)
        letsencrypt: { type: boolean, description: The letsencrypt plugin is installed and enabled }
        unavailable:
          type: object
          additionalProperties: { type: string }
          description: Why a plugin or feature is hidden, keyed by plugin name or "dokku" (CMD-2)

    PluginKind:
      type: string
      enum: [datastore, letsencrypt, other]

    InstalledPlugin:
      type: object
      required: [name, version, kind, usable]
      properties:
        name: { type: string }
        version: { type: string }
        kind: { $ref: "#/components/schemas/PluginKind" }
        usable: { type: boolean, description: Gokku uses this plugin }
        reason: { type: string, nullable: true, description: Why Gokku cannot use it }

    AvailablePlugin:
      type: object
      required: [name, kind, git_url]
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/PluginKind" }
        git_url: { type: string, description: "For sudo dokku plugin:install <git_url> <name>" }

    PluginList:
      type: object
      required: [installed, available]
      properties:
        installed:
          type: array
          items: { $ref: "#/components/schemas/InstalledPlugin" }
          description: Installed plugins that are not part of Dokku core
        available:
          type: array
          items: { $ref: "#/components/schemas/AvailablePlugin" }
          description: Recognised plugins that are not installed

    ProjectRef:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }

    ServiceRef:
      type: object
      required: [type, name]
      properties:
        type: { type: string }
        name: { type: string }

    AppSummary:
      type: object
      required: [name, status, domains, deploy_source, services]
      properties:
        name: { type: string }
        status: { $ref: "#/components/schemas/AppStatus" }
        project: { allOf: [{ $ref: "#/components/schemas/ProjectRef" }], nullable: true, description: Null when unassigned (PRJ-6) }
        domains:
          type: array
          items: { type: string }
        revision: { type: string, nullable: true, description: Git sha of the deployed code }
        deployed_at: { type: string, format: date-time, nullable: true }
        deploy_source: { type: string, description: "Dokku's deploy source: git-push, docker-image, git-sync, or empty" }
        services:
          type: array
          items: { $ref: "#/components/schemas/ServiceRef" }

    Process:
      type: object
      required: [type, count, running]
      properties:
        type: { type: string }
        count: { type: integer }
        running: { type: integer }

    AppDetail:
      allOf:
        - { $ref: "#/components/schemas/AppSummary" }
        - type: object
          required: [deployed, locked, builder, processes]
          properties:
            deployed: { type: boolean }
            locked: { type: boolean, description: A deploy holds the app lock }
            created_at: { type: string, format: date-time, nullable: true }
            builder: { type: string }
            source_image: { type: string, nullable: true }
            processes:
              type: array
              items: { $ref: "#/components/schemas/Process" }

    ServiceSummary:
      type: object
      required: [type, name, status, version, links]
      properties:
        type: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/ServiceStatus" }
        version: { type: string }
        project: { allOf: [{ $ref: "#/components/schemas/ProjectRef" }], nullable: true }
        links:
          type: array
          items: { type: string }
          description: Names of the linked apps

    StatusCounts:
      type: object
      required: [running, stopped, deploying, failed]
      properties:
        running: { type: integer }
        stopped: { type: integer }
        deploying: { type: integer }
        failed: { type: integer }

    ProjectSummary:
      type: object
      required: [slug, name, description, health, status_counts, apps, services]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        health: { $ref: "#/components/schemas/AppStatus" }
        status_counts: { $ref: "#/components/schemas/StatusCounts" }
        apps:
          type: array
          items: { $ref: "#/components/schemas/AppState" }
        services:
          type: array
          items: { $ref: "#/components/schemas/ServiceRef" }

    AppState:
      type: object
      required: [name, status]
      properties:
        name: { type: string }
        status: { $ref: "#/components/schemas/AppStatus" }

    ActivityEntry:
      type: object
      required: [id, ts, actor_name, actor_type, action, target_type, target_name, result, source]
      properties:
        id: { type: integer, format: int64 }
        ts: { type: string, format: date-time }
        actor_name: { type: string }
        actor_type: { type: string, enum: [user, token, system, git] }
        action: { type: string }
        target_type: { type: string }
        target_name: { type: string }
        result: { type: string, enum: [ok, fail] }
        source: { type: string, enum: [web, api, git, system] }

    ProjectDetail:
      type: object
      required: [slug, name, description, created_at, health, status_counts, apps, services, domain_count, activity]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        health: { $ref: "#/components/schemas/AppStatus" }
        status_counts: { $ref: "#/components/schemas/StatusCounts" }
        apps:
          type: array
          items: { $ref: "#/components/schemas/AppSummary" }
        services:
          type: array
          items: { $ref: "#/components/schemas/ServiceSummary" }
        domain_count: { type: integer }
        last_deploy_at: { type: string, format: date-time, nullable: true }
        activity:
          type: array
          items: { $ref: "#/components/schemas/ActivityEntry" }
          description: The latest audit entries for the project

    ProjectSlug:
      type: string
      minLength: 1
      maxLength: 40
      pattern: "^[a-z0-9][a-z0-9-]{0,39}$"
      description: Lowercase letters, digits and dashes; immutable after creation (PRJ-1)

    CreateProjectRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        slug: { $ref: "#/components/schemas/ProjectSlug" }
        description: { type: string, maxLength: 500 }

    UpdateProjectRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }
