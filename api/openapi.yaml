        - { name: project, in: query, schema: { type: string } }
        - { name: result, in: query, schema: { type: string, enum: [ok, fail] } }
        - { name: source, in: query, schema: { type: string, enum: [web, api, git, system] } }
      responses:
        "200":
          description: CSV with a header row
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

security:
  - session: []
  - bearer: []

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: gokku_session
    bearer:
      type: http
      scheme: bearer

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
              description: Per-field validation messages, keyed by request field name

    ErrorCode:
      type: string
      enum:
        - validation_failed
        - invalid_credentials
        - rate_limited
        - setup_complete
        - unauthorized
        - forbidden
        - csrf_failed
        - not_found
        - method_not_allowed
        - last_admin
        - username_taken
        - token_name_taken
        - invite_invalid
        - not_invited
        - wrong_password
        - cannot_revoke_current
        - project_exists
        - confirm_mismatch
        - dokku_unreachable
        - app_protected
        - job_finished
        - too_many_streams
        - managed_variable
        - reserved_key
        - domain_exists
        - plugin_missing
        - app_exists
        - nothing_to_retry
        - service_exists
        - service_linked
        - cross_project_link
        - already_linked
        - not_linked
        - internal

    Role:
      type: string
      enum: [viewer, operator, admin]

    UserStatus:
      type: string
      enum: [active, invited, disabled]

    Theme:
      type: string
      enum: [system, light, dark]

    Username:
      type: string
      minLength: 3
      maxLength: 32
      pattern: "^[a-z0-9][a-z0-9_-]{2,31}$"
      description: Lowercase letters, digits, dash and underscore; starts with a letter or digit (USR-1)

    Password:
      type: string
      maxLength: 1024
      description: Minimum length is SetupStatus.min_password_length (AUTH-2)

    SetupStatus:
      type: object
      required: [setup_required, min_password_length]
      properties:
        setup_required: { type: boolean }
        min_password_length: { type: integer }

    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 64 }
        password: { $ref: "#/components/schemas/Password" }

    Me:
      type: object
      required: [id, username, role, theme]
      properties:
        id: { type: string }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        theme: { $ref: "#/components/schemas/Theme" }

    UpdateMeRequest:
      type: object
      properties:
        username: { $ref: "#/components/schemas/Username" }
        theme: { $ref: "#/components/schemas/Theme" }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { $ref: "#/components/schemas/Password" }
        new_password: { $ref: "#/components/schemas/Password" }

    Session:
      type: object
      required: [id, created_at, last_seen_at, expires_at, user_agent, ip, current]
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        user_agent: { type: string }
        ip: { type: string }
        current: { type: boolean, description: True for the session making the request }

    Invite:
      type: object
      required: [username, expires_at]
      properties:
        username: { type: string }
        expires_at: { type: string, format: date-time }

    AcceptInviteRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { $ref: "#/components/schemas/Password" }

    User:
      type: object
      required: [id, username, role, status, created_at]
      properties:
        id: { type: string }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/UserStatus" }
        created_at: { type: string, format: date-time }
        last_active_at: { type: string, format: date-time, nullable: true }
        invite_expires_at: { type: string, format: date-time, nullable: true }

    InviteUserRequest:
      type: object
      required: [username, role]
      properties:
        username: { $ref: "#/components/schemas/Username" }
        role: { $ref: "#/components/schemas/Role" }

    InviteCreated:
      type: object
      required: [user, invite_url, expires_at]
      properties:
        user: { $ref: "#/components/schemas/User" }
        invite_url: { type: string, description: "One-time link, shown only in this response" }
        expires_at: { type: string, format: date-time }

    UpdateUserRequest:
      type: object
      properties:
        role: { $ref: "#/components/schemas/Role" }
        status:
          type: string
          enum: [active, disabled]
          description: Disable or re-enable a user. Invited users become active by accepting their invite.

    Token:
      type: object
      required: [id, name, prefix, role, owner, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string, description: "First characters of the token, for recognition" }
        role: { $ref: "#/components/schemas/Role" }
        owner: { type: string, description: Username of the owner }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }

    CreateTokenRequest:
      type: object
      required: [name, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        role: { $ref: "#/components/schemas/Role" }

    TokenCreated:
      type: object
      required: [token, secret]
      properties:
        token: { $ref: "#/components/schemas/Token" }
        secret: { type: string, description: "The full token (gk_...). Shown once." }

    AppStatus:
      type: string
      enum: [running, stopped, deploying, failed]
      description: Derived as in DESIGN.md "Status derivation" (APP-2)

    ServiceStatus:
      type: string
      enum: [running, stopped, missing]
      description: missing means the service container does not exist

    ServerInfo:
      type: object
      required: [name, host, reachable, plugins, datastores, letsencrypt, unavailable]
      properties:
        name: { type: string, description: The server's host name }
        host: { type: string, description: "Host for git remotes: GOKKU_DOKKU_HOST, or the request host" }
        dokku_version: { type: string, nullable: true, description: Null until the first successful probe }
        reachable: { type: boolean }
        last_ok_at: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true, description: Why the last refresh failed }
        error_command: { type: string, nullable: true, description: The dokku command that failed }
        plugins:
          type: array
          items: { type: string }
          description: Names of the installed and enabled plugins
        datastores:
          type: array
          items: { type: string }
          description: Datastore plugins Gokku can use (SVC-1)
        letsencrypt: { type: boolean, description: The letsencrypt plugin is installed and enabled }
        unavailable:
          type: object
          additionalProperties: { type: string }
          description: Why a plugin or feature is hidden, keyed by plugin name or "dokku" (CMD-2)

    PluginKind:
      type: string
      enum: [datastore, letsencrypt, other]

    InstalledPlugin:
      type: object
      required: [name, version, kind, usable]
      properties:
        name: { type: string }
        version: { type: string }
        kind: { $ref: "#/components/schemas/PluginKind" }
        usable: { type: boolean, description: Gokku uses this plugin }
        reason: { type: string, nullable: true, description: Why Gokku cannot use it }

    AvailablePlugin:
      type: object
      required: [name, kind, git_url]
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/PluginKind" }
        git_url: { type: string, description: "For sudo dokku plugin:install <git_url> <name>" }

    PluginList:
      type: object
      required: [installed, available]
      properties:
        installed:
          type: array
          items: { $ref: "#/components/schemas/InstalledPlugin" }
          description: Installed plugins that are not part of Dokku core
        available:
          type: array
          items: { $ref: "#/components/schemas/AvailablePlugin" }
          description: Recognised plugins that are not installed

    ProjectRef:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }

    ServiceRef:
      type: object
      required: [type, name]
      properties:
        type: { type: string }
        name: { type: string }

    AppSummary:
      type: object
      required: [name, status, domains, deploy_source, services]
      properties:
        name: { type: string }
        status: { $ref: "#/components/schemas/AppStatus" }
        project: { allOf: [{ $ref: "#/components/schemas/ProjectRef" }], nullable: true, description: Null when unassigned (PRJ-6) }
        domains:
          type: array
          items: { type: string }
        revision: { type: string, nullable: true, description: Git sha of the deployed code }
        deployed_at: { type: string, format: date-time, nullable: true }
        deploy_source: { type: string, description: "Dokku's deploy source: git-push, docker-image, git-sync, or empty" }
        services:
          type: array
          items: { $ref: "#/components/schemas/ServiceRef" }

    Process:
      type: object
      required: [type, count, running]
      properties:
        type: { type: string }
        count: { type: integer }
        running: { type: integer }

    AppDetail:
      allOf:
        - { $ref: "#/components/schemas/AppSummary" }
        - type: object
          required: [deployed, locked, builder, processes]
          properties:
            deployed: { type: boolean }
            locked: { type: boolean, description: A deploy holds the app lock }
            created_at: { type: string, format: date-time, nullable: true }
            builder: { type: string }
            source_image: { type: string, nullable: true }
            processes:
              type: array
              items: { $ref: "#/components/schemas/Process" }

    ServiceSummary:
      type: object
      required: [type, name, status, version, links]
      properties:
        type: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/ServiceStatus" }
        version: { type: string }
        project: { allOf: [{ $ref: "#/components/schemas/ProjectRef" }], nullable: true }
        links:
          type: array
          items: { type: string }
          description: Names of the linked apps

    CreateServiceRequest:
      type: object
      required: [type, name, project]
      properties:
        type: { type: string, description: "A usable datastore plugin, such as postgres" }
        name: { type: string, maxLength: 64 }
        project: { type: string, description: Project slug; a service is created in a project (SVC-2) }

    ServiceLinkRequest:
      type: object
      required: [app]
      properties:
        app: { type: string }

    ServiceConnection:
      type: object
      required: [scheme, host, masked]
      description: The connection string's parts without its password (SVC-4)
      properties:
        scheme: { type: string }
        host: { type: string }
        port: { type: string, nullable: true }
        username: { type: string, nullable: true }
        database: { type: string, nullable: true }
        masked: { type: string, description: The connection string with the password replaced }
        has_password: { type: boolean }

    ServiceDetail:
      allOf:
        - { $ref: "#/components/schemas/ServiceSummary" }
        - type: object
          required: [link_env]
          properties:
            link_env: { type: string, description: "The variable linking sets on an app, such as DATABASE_URL" }
            connection:
              allOf: [{ $ref: "#/components/schemas/ServiceConnection" }]
              nullable: true
              description: Null when Dokku cannot be reached

    ServiceConnectionRevealed:
      type: object
      required: [dsn]
      properties:
        dsn: { type: string }

    Settings:
      type: object
      required: [session_lifetime_hours, min_password_length, job_retention_days, protected_apps, gokku_version]
      properties:
        global_domains:
          type: array
          items: { type: string }
          nullable: true
          description: Null when Dokku cannot be reached
        session_lifetime_hours: { type: integer }
        min_password_length: { type: integer }
        job_retention_days: { type: integer }
        protected_apps:
          type: array
          items: { type: string }
          description: Apps that cannot be stopped, rebuilt, renamed, moved or destroyed (SET-2)
        gokku_version: { type: string }

    UpdateSettingsRequest:
      type: object
      properties:
        global_domains:
          type: array
          items: { type: string }
          maxItems: 50
        session_lifetime_hours: { type: integer, minimum: 1, maximum: 8760 }
        min_password_length: { type: integer, minimum: 8, maximum: 128 }
        job_retention_days: { type: integer, minimum: 1, maximum: 3650 }
        protected_apps:
          type: array
          items: { type: string }
          maxItems: 200

    StatusCounts:
      type: object
      required: [running, stopped, deploying, failed]
      properties:
        running: { type: integer }
        stopped: { type: integer }
        deploying: { type: integer }
        failed: { type: integer }

    ProjectSummary:
      type: object
      required: [slug, name, description, health, status_counts, apps, services]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        health: { $ref: "#/components/schemas/AppStatus" }
        status_counts: { $ref: "#/components/schemas/StatusCounts" }
        apps:
          type: array
          items: { $ref: "#/components/schemas/AppState" }
        services:
          type: array
          items: { $ref: "#/components/schemas/ServiceRef" }

    AppState:
      type: object
      required: [name, status]
      properties:
        name: { type: string }
        status: { $ref: "#/components/schemas/AppStatus" }

    ActivityEntry:
      type: object
      required: [id, ts, actor_name, actor_type, action, target_type, target_name, project_slug, result, source]
      properties:
        project_slug: { type: string, description: Empty when the entry belongs to no project }
        job_id: { type: string, nullable: true }
        id: { type: integer, format: int64 }
        ts: { type: string, format: date-time }
        actor_name: { type: string }
        actor_type: { type: string, enum: [user, token, system, git] }
        action: { type: string }
        target_type: { type: string }
        target_name: { type: string }
        result: { type: string, enum: [ok, fail] }
        source: { type: string, enum: [web, api, git, system] }

    ProjectDetail:
      type: object
      required: [slug, name, description, created_at, health, status_counts, apps, services, domain_count, activity]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        health: { $ref: "#/components/schemas/AppStatus" }
        status_counts: { $ref: "#/components/schemas/StatusCounts" }
        apps:
          type: array
          items: { $ref: "#/components/schemas/AppSummary" }
        services:
          type: array
          items: { $ref: "#/components/schemas/ServiceSummary" }
        domain_count: { type: integer }
        last_deploy_at: { type: string, format: date-time, nullable: true }
        activity:
          type: array
          items: { $ref: "#/components/schemas/ActivityEntry" }
          description: The latest audit entries for the project

    ProjectSlug:
      type: string
      minLength: 1
      maxLength: 40
      pattern: "^[a-z0-9][a-z0-9-]{0,39}$"
      description: Lowercase letters, digits and dashes; immutable after creation (PRJ-1)

    CreateProjectRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        slug: { $ref: "#/components/schemas/ProjectSlug" }
        description: { type: string, maxLength: 500 }

    UpdateProjectRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }

    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, canceled]

    StepStatus:
      type: string
      enum: [queued, running, succeeded, failed, skipped, canceled]

    JobRef:
      type: object
      required: [job_id]
      properties:
        job_id: { type: string }

    Job:
      type: object
      required: [id, kind, title, status, source, created_at]
      properties:
        id: { type: string }
        kind: { type: string, description: "app.restart, app.stop, app.start, app.rebuild, deploy.*" }
        title: { type: string }
        status: { $ref: "#/components/schemas/JobStatus" }
        app: { type: string, nullable: true }
        project: { allOf: [{ $ref: "#/components/schemas/ProjectRef" }], nullable: true }
        creator: { type: string, nullable: true, description: Username of who started it }
        source: { type: string, enum: [web, api, system] }
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }

    JobStep:
      type: object
      required: [position, name, status]
      properties:
        position: { type: integer }
        name: { type: string }
        status: { $ref: "#/components/schemas/StepStatus" }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }

    JobDetail:
      allOf:
        - { $ref: "#/components/schemas/Job" }
        - type: object
          required: [steps, children]
          properties:
            steps:
              type: array
              items: { $ref: "#/components/schemas/JobStep" }
            parent_id: { type: string, nullable: true }
            children:
              type: array
              items: { $ref: "#/components/schemas/Job" }
              description: For a project action, one job per app (JOB-5)

    JobPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Job" }
        next_cursor: { type: string, nullable: true }

    JobLine:
      type: object
      required: [seq, ts, stream, text]
      properties:
        seq: { type: integer, format: int64 }
        ts: { type: string, format: date-time }
        stream: { type: string, enum: [stdout, stderr, system] }
        text: { type: string }
        step: { type: integer, nullable: true, description: Position of the step that printed it }

    LogLine:
      type: object
      required: [text]
      properties:
        ts: { type: string, format: date-time, nullable: true }
        process: { type: string, nullable: true, description: "Container, such as web.1" }
        text: { type: string }

    LogTail:
      type: object
      required: [lines, processes]
      properties:
        lines:
          type: array
          items: { $ref: "#/components/schemas/LogLine" }
        processes:
          type: array
          items: { type: string }
          description: "The app's containers, such as web.1, for the process filter"

    AuditPage:
      type: object
      required: [items, actors]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ActivityEntry" }
        next_cursor: { type: string, nullable: true }
        actors:
          type: array
          items: { type: string }
          description: Every actor name in the log, for the user filter

    ConfigVar:
      type: object
      required: [key, masked]
      properties:
        key: { type: string }
        value: { type: string, nullable: true, description: Absent when masked }
        masked: { type: boolean, description: "The key looks secret (CFG-1); reveal it to see the value" }
        managed_by:
          type: string
          nullable: true
          description: "service:<name> or project:<slug> when the value is set at its source, read-only here (CFG-3)"

    AppConfig:
      type: object
      required: [vars]
      properties:
        vars:
          type: array
          items: { $ref: "#/components/schemas/ConfigVar" }

    UpdateConfigRequest:
      type: object
      properties:
        set:
          type: object
          additionalProperties: { type: string }
          description: Variables to set
        unset:
          type: array
          items: { type: string }
          description: Keys to remove
        restart: { type: boolean, description: Restart the app once after writing }

    ConfigUpdated:
      type: object
      required: [config]
      properties:
        config: { $ref: "#/components/schemas/AppConfig" }
        job_id: { type: string, nullable: true, description: The restart job }

    RevealRequest:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { type: string }
          minItems: 1
          maxItems: 100

    RevealedValues:
      type: object
      required: [values]
      properties:
        values:
          type: object
          additionalProperties: { type: string }

    EnvStatus:
      type: string
      enum: [applied, overridden, pending]

    AppEnvStatus:
      type: object
      required: [app, status]
      properties:
        app: { type: string }
        status: { $ref: "#/components/schemas/EnvStatus" }

    SharedVar:
      type: object
      required: [key, secret, masked, apps]
      properties:
        key: { type: string }
        value: { type: string, nullable: true, description: Absent for secret values }
        secret: { type: boolean }
        masked: { type: boolean }
        updated_at: { type: string, format: date-time, nullable: true }
        apps:
          type: array
          items: { $ref: "#/components/schemas/AppEnvStatus" }
          description: The variable's status in each member app

    ProjectEnv:
      type: object
      required: [vars, apps, reachable]
      properties:
        vars:
          type: array
          items: { $ref: "#/components/schemas/SharedVar" }
        apps:
          type: array
          items: { type: string }
          description: The member apps
        reachable: { type: boolean, description: False when the statuses could not be read from Dokku }

    SharedVarInput:
      type: object
      required: [key]
      properties:
        key: { type: string, pattern: "^[A-Z_][A-Z0-9_]{0,127}$" }
        value: { type: string, maxLength: 65536, description: Omit to keep the stored value of an existing key }
        secret: { type: boolean }

    PutProjectEnvRequest:
      type: object
      required: [vars]
      properties:
        vars:
          type: array
          items: { $ref: "#/components/schemas/SharedVarInput" }
          maxItems: 200
        apply: { type: boolean, description: Write the variables into the member apps now }
        restart: { type: boolean, description: Restart each changed app once after applying (SHV-3) }

    ProjectEnvSaved:
      type: object
      required: [env]
      properties:
        env: { $ref: "#/components/schemas/ProjectEnv" }
        job_id: { type: string, nullable: true }

    ApplyEnvRequest:
      type: object
      properties:
        restart: { type: boolean }

    AppDomains:
      type: object
      required: [domains, dns_target]
      properties:
        domains:
          type: array
          items: { type: string }
        dns_target: { type: string, description: "Where A records should point: GOKKU_DOKKU_HOST, or the request host (SSL-3)" }

    DomainRequest:
      type: object
      required: [domain]
      properties:
        domain: { type: string, maxLength: 253 }

    SSLStatus:
      type: object
      required: [available, active, auto_renew, uncovered]
      properties:
        available: { type: boolean, description: The letsencrypt plugin is installed }
        active: { type: boolean }
        expires_at: { type: string, format: date-time, nullable: true }
        auto_renew: { type: boolean, description: "The plugin's renewal cron job is installed; it renews every app" }
        email: { type: string, nullable: true, description: "The app's contact email, else the global one" }
        uncovered:
          type: array
          items: { type: string }
          description: Domains added through Gokku after the certificate was issued (SSL-2)

    SSLRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [enable, renew, disable, set_email, set_auto_renew] }
        email: { type: string, maxLength: 254 }
        auto_renew: { type: boolean }

    ProcessScale:
      type: object
      required: [type, quantity, running]
      properties:
        type: { type: string }
        quantity: { type: integer, description: Desired instances }
        running: { type: integer, description: Instances running now }

    AppScale:
      type: object
      required: [can_scale, processes]
      properties:
        can_scale: { type: boolean, description: "False when the app's app.json sets the formation" }
        processes:
          type: array
          items: { $ref: "#/components/schemas/ProcessScale" }

    ScaleRequest:
      type: object
      required: [processes]
      properties:
        processes:
          type: object
          additionalProperties: { type: integer, minimum: 0, maximum: 100 }
          description: Instances per process type; only the types to change

    AppSource:
      type: string
      enum: [git, image, repository]
      description: "How the app will be deployed: git push, a Docker image or a Git repository URL"

    CreateAppRequest:
      type: object
      required: [name, project, source]
      properties:
        name: { type: string, minLength: 1, maxLength: 128, pattern: "^[a-z0-9][a-z0-9.-]*$" }
        project: { type: string, description: Project slug }
        source: { $ref: "#/components/schemas/AppSource" }

    AppCreated:
      type: object
      required: [app, git_remote, source]
      properties:
        app: { $ref: "#/components/schemas/AppSummary" }
        git_remote: { type: string, description: "dokku@<host>:<app>" }
        source: { $ref: "#/components/schemas/AppSource" }
        job_id: { type: string, nullable: true, description: Applies the project's shared variables }

    UpdateAppRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 128, description: The new name }
        project: { type: string, description: The slug of the project to move the app to }

    DeploySource:
      type: string
      enum: [git, image, repository, rebuild, observed]

    Deploy:
      type: object
      required: [id, source, ref, status, started_at]
      properties:
        id: { type: string }
        source: { $ref: "#/components/schemas/DeploySource" }
        ref: { type: string, description: "Image, repository#ref, or the observed revision" }
        status: { type: string, enum: [running, succeeded, failed, canceled] }
        job_id: { type: string, nullable: true, description: "Absent for observed deploys, which have no output" }
        creator: { type: string, nullable: true }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }

    AppDeploys:
      type: object
      required: [git_remote, deploys]
      properties:
        git_remote: { type: string, description: "dokku@<host>:<app>, for git push" }
        deploy_branch: { type: string, description: The branch Dokku deploys on push }
        deploys:
          type: array
          items: { $ref: "#/components/schemas/Deploy" }

    DeployRequest:
      type: object
      required: [source]
      properties:
        source: { type: string, enum: [image, repository] }
        image: { type: string, maxLength: 255, description: For source image }
        url: { type: string, maxLength: 2048, description: For source repository }
        ref: { type: string, maxLength: 255, description: "Branch, tag or commit; default branch when empty" }
