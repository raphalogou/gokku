version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - gosec
    - bodyclose
    - errorlint
    - misspell
    - nolintlint
  exclusions:
    rules:
      # Tests are full of fixture passwords and tokens.
      - path: _test\.go
        linters: [gosec]
        text: G101

formatters:
  enable:
    - gofmt
    - goimports
